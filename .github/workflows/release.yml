name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "VERSION=${VERSION}"

      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          CANONICAL="v${VERSION}"
          LEGACY="v.${VERSION}"

          if [[ "${TAG}" != "${CANONICAL}" && "${TAG}" != "${LEGACY}" ]]; then
            echo "::error::Tag '${TAG}' does not match VERSION '${VERSION}'."
            echo "::error::Use '${CANONICAL}' (preferred) or '${LEGACY}' (legacy-compatible)."
            exit 1
          fi

          echo "Accepted release tag: ${TAG}"

      - name: Validate scripts and frontend
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
          node --check app/wwwroot/app.js

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore app/MyOnlineTV.Web.csproj

      - name: Build
        run: dotnet build app/MyOnlineTV.Web.csproj -c Release --no-restore

      - name: Restore linux-x64
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore app/MyOnlineTV.Web.csproj -r linux-x64

      - name: Publish linux-x64
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/publish
          dotnet publish app/MyOnlineTV.Web.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            --no-restore \
            -o dist/publish

      - name: Create release artifacts
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          APP="myonline-tv-web-v${VERSION}-linux-x64.tar.gz"
          SRC="myonline-tv-lxc-v${VERSION}-source.tar.gz"

          rm -f "${APP}" "${SRC}" SHA256SUMS-RELEASE.txt

          tar -C dist/publish -czf "/tmp/${APP}" .

          tar \
            --exclude='.git' \
            --exclude='app/bin' \
            --exclude='app/obj' \
            --exclude='dist' \
            --exclude='*.tar.gz' \
            --exclude='SHA256SUMS-RELEASE.txt' \
            -czf "/tmp/${SRC}" .

          mv "/tmp/${APP}" .
          mv "/tmp/${SRC}" .

          sha256sum "${APP}" "${SRC}" release.json > SHA256SUMS-RELEASE.txt

          echo "Created:"
          ls -lh "${APP}" "${SRC}" SHA256SUMS-RELEASE.txt release.json

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          APP="myonline-tv-web-v${VERSION}-linux-x64.tar.gz"
          SRC="myonline-tv-lxc-v${VERSION}-source.tar.gz"

          test -s "${APP}"
          test -s "${SRC}"
          test -s "SHA256SUMS-RELEASE.txt"
          test -s "release.json"

          grep "  ${APP}$" SHA256SUMS-RELEASE.txt
          grep "  ${SRC}$" SHA256SUMS-RELEASE.txt
          grep "  release.json$" SHA256SUMS-RELEASE.txt

          tar -tzf "${APP}" >/dev/null
          tar -tzf "${SRC}" >/dev/null

          VERSION_IN_JSON="$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          test "${VERSION_IN_JSON}" = "${VERSION}"

      - name: Smoke test published application archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP="myonline-tv-web-v${VERSION}-linux-x64.tar.gz"
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          tar -xzf "${APP}" -C "${TMP}"
          test -s "${TMP}/MyOnlineTV.Web.dll"
          test -s "${TMP}/MyOnlineTV.Web.runtimeconfig.json"
          test -s "${TMP}/wwwroot/index.html"
          test -s "${TMP}/wwwroot/app.js"
          grep -q "MyOnline TV" "${TMP}/wwwroot/index.html"
          echo "Release smoke test passed."

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS-RELEASE.txt
          echo "Release checksums verified."

      - name: Publish GitHub Release resiliently
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          APP="myonline-tv-web-v${VERSION}-linux-x64.tar.gz"
          SRC="myonline-tv-lxc-v${VERSION}-source.tar.gz"
          REQUIRED=("${APP}" "${SRC}" "SHA256SUMS-RELEASE.txt" "release.json")

          for f in "${REQUIRED[@]}"; do
            test -s "${f}"
          done

          # Create the release metadata without assets. If a previous attempt
          # created a partial release for this tag, resume it instead.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; resuming asset publication."
          else
            gh release create "${TAG}" \
              --verify-tag \
              --generate-notes \
              --title "${TAG}"
          fi

          upload_with_retry() {
            local file="$1"
            local max_attempts=6
            local attempt=1
            local delay=5

            while true; do
              echo "Uploading ${file} (attempt ${attempt}/${max_attempts})..."
              if gh release upload "${TAG}" "${file}" --clobber; then
                echo "Uploaded ${file}."
                return 0
              fi

              if (( attempt >= max_attempts )); then
                echo "::error::Failed to upload ${file} after ${max_attempts} attempts."
                return 1
              fi

              echo "GitHub asset upload failed; retrying in ${delay}s..."
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # Upload separately so one transient uploads.github.com failure does
          # not force all other assets to be recreated.
          for f in "${REQUIRED[@]}"; do
            upload_with_retry "${f}"
          done

          # A previous failed run can leave the release as a draft.
          # Publish it before validating public release state.
          gh release edit "${TAG}" --draft=false --prerelease=false --latest

          RELEASE_JSON="$(gh release view "${TAG}" --json tagName,isDraft,isPrerelease,url,assets)"
          jq -e --arg tag "${TAG}" \
            '(.tagName == $tag) and (.isDraft == false) and (.isPrerelease == false)' \
            <<<"${RELEASE_JSON}" >/dev/null

          for f in "${REQUIRED[@]}"; do
            COUNT="$(jq -r --arg name "${f}" '[.assets[] | select(.name == $name and .size > 0)] | length' <<<"${RELEASE_JSON}")"
            if [[ "${COUNT}" != "1" ]]; then
              echo "::error::Mandatory GitHub Release asset missing, empty, or duplicated: ${f}"
              exit 1
            fi
            SIZE="$(jq -r --arg name "${f}" '.assets[] | select(.name == $name) | .size' <<<"${RELEASE_JSON}")"
            echo "Verified GitHub asset: ${f} (${SIZE} bytes)"
          done

          echo "Release ${TAG} published with all mandatory assets."
          jq '{tagName, isDraft, isPrerelease, url, assets: [.assets[].name]}' <<<"${RELEASE_JSON}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myonline-tv-v${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            myonline-tv-web-v${{ steps.version.outputs.version }}-linux-x64.tar.gz
            myonline-tv-lxc-v${{ steps.version.outputs.version }}-source.tar.gz
            SHA256SUMS-RELEASE.txt
            release.json
