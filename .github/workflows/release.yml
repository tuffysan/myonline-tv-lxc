name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "VERSION=${VERSION}"

      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          CANONICAL="v${VERSION}"
          LEGACY="v.${VERSION}"

          if [[ "${TAG}" != "${CANONICAL}" && "${TAG}" != "${LEGACY}" ]]; then
            echo "::error::Tag '${TAG}' does not match VERSION '${VERSION}'."
            echo "::error::Use '${CANONICAL}' (preferred) or '${LEGACY}' (legacy-compatible)."
            exit 1
          fi

          echo "Accepted release tag: ${TAG}"

      - name: Validate scripts and frontend
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
          node --check app/wwwroot/app.js

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore app/MyOnlineTV.Web.csproj

      - name: Build
        run: dotnet build app/MyOnlineTV.Web.csproj -c Release --no-restore

      - name: Restore linux-x64
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore app/MyOnlineTV.Web.csproj -r linux-x64

      - name: Publish linux-x64
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/publish
          dotnet publish app/MyOnlineTV.Web.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            --no-restore \
            -o dist/publish

      - name: Create release artifacts
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          APP="myonline-tv-web-v${VERSION}-linux-x64.tar.gz"
          SRC="myonline-tv-lxc-v${VERSION}-source.tar.gz"

          rm -f "${APP}" "${SRC}" SHA256SUMS-RELEASE.txt

          tar -C dist/publish -czf "/tmp/${APP}" .

          tar \
            --exclude='.git' \
            --exclude='app/bin' \
            --exclude='app/obj' \
            --exclude='dist' \
            --exclude='*.tar.gz' \
            --exclude='SHA256SUMS-RELEASE.txt' \
            -czf "/tmp/${SRC}" .

          mv "/tmp/${APP}" .
          mv "/tmp/${SRC}" .

          sha256sum "${APP}" "${SRC}" release.json > SHA256SUMS-RELEASE.txt

          echo "Created:"
          ls -lh "${APP}" "${SRC}" SHA256SUMS-RELEASE.txt release.json

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          APP="myonline-tv-web-v${VERSION}-linux-x64.tar.gz"
          SRC="myonline-tv-lxc-v${VERSION}-source.tar.gz"

          test -s "${APP}"
          test -s "${SRC}"
          test -s "SHA256SUMS-RELEASE.txt"
          test -s "release.json"

          grep "  ${APP}$" SHA256SUMS-RELEASE.txt
          grep "  ${SRC}$" SHA256SUMS-RELEASE.txt
          grep "  release.json$" SHA256SUMS-RELEASE.txt

          tar -tzf "${APP}" >/dev/null
          tar -tzf "${SRC}" >/dev/null

          VERSION_IN_JSON="$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          test "${VERSION_IN_JSON}" = "${VERSION}"

      - name: Smoke test published application archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP="myonline-tv-web-v${VERSION}-linux-x64.tar.gz"
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          tar -xzf "${APP}" -C "${TMP}"
          test -s "${TMP}/MyOnlineTV.Web.dll"
          test -s "${TMP}/MyOnlineTV.Web.runtimeconfig.json"
          test -s "${TMP}/wwwroot/index.html"
          test -s "${TMP}/wwwroot/app.js"
          grep -q "MyOnline TV" "${TMP}/wwwroot/index.html"
          echo "Release smoke test passed."

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS-RELEASE.txt
          echo "Release checksums verified."

      - name: Publish GitHub Release atomically
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          APP="myonline-tv-web-v${VERSION}-linux-x64.tar.gz"
          SRC="myonline-tv-lxc-v${VERSION}-source.tar.gz"
          API="repos/${GITHUB_REPOSITORY}"

          # Resolve a previous draft/public release when rerunning. New releases are
          # created directly through REST so GitHub returns the numeric release ID.
          RELEASE_ID="$(gh api --paginate "${API}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -1)"

          if [[ -z "${RELEASE_ID}" ]]; then
            RELEASE_JSON="$(gh api --method POST "${API}/releases" \
              -f tag_name="${TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="${TAG}" \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=true)"
            RELEASE_ID="$(jq -r '.id // empty' <<<"${RELEASE_JSON}")"
          else
            gh api --method PATCH "${API}/releases/${RELEASE_ID}" \
              -F draft=true -F prerelease=false >/dev/null
          fi

          if [[ -z "${RELEASE_ID}" ]]; then
            echo "::error::Could not create/resolve GitHub Release ID for ${TAG}."
            exit 1
          fi
          echo "Release ID: ${RELEASE_ID}"

          # Upload by numeric release ID, never by tag/draft URL. Delete any same-name
          # asset first so a rerun is deterministic.
          for f in "${APP}" "${SRC}" SHA256SUMS-RELEASE.txt release.json; do
            test -s "${f}"
            OLD_ID="$(gh api "${API}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${f}\") | .id" | head -1)"
            if [[ -n "${OLD_ID}" ]]; then
              gh api --method DELETE "${API}/releases/assets/${OLD_ID}"
            fi
            curl --fail-with-body --silent --show-error --location \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${f}" \
              | jq -e --arg name "${f}" '.name == $name and .state == "uploaded" and .size > 0' >/dev/null
          done

          # Verify the complete asset set from GitHub before publication.
          for f in "${APP}" "${SRC}" SHA256SUMS-RELEASE.txt release.json; do
            SIZE="$(gh api "${API}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${f}\") | .size" | head -1)"
            if [[ -z "${SIZE}" || "${SIZE}" -le 0 ]]; then
              echo "::error::Mandatory GitHub Release asset missing or empty: ${f}"
              exit 1
            fi
            echo "Verified GitHub asset: ${f} (${SIZE} bytes)"
          done

          # Only a fully verified release becomes public and Latest.
          gh api --method PATCH "${API}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null

          gh api "${API}/releases/${RELEASE_ID}" \
            --jq '{tag_name: .tag_name, draft: .draft, prerelease: .prerelease, html_url: .html_url, assets: [.assets[].name]}'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myonline-tv-v${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            myonline-tv-web-v${{ steps.version.outputs.version }}-linux-x64.tar.gz
            myonline-tv-lxc-v${{ steps.version.outputs.version }}-source.tar.gz
            SHA256SUMS-RELEASE.txt
            release.json
