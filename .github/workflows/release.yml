name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches VERSION
        shell: bash
        run: |
          EXPECTED="v$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "${EXPECTED}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${EXPECTED}"
            exit 1
          }

      - name: Validate scripts and frontend
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
          node --check app/wwwroot/app.js

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build app/MyOnlineTV.Web.csproj -c Release

      - name: Publish linux-x64
        run: |
          rm -rf dist
          mkdir -p dist/publish
          dotnet publish app/MyOnlineTV.Web.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o dist/publish

      - name: Create release artifacts
        shell: bash
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          APP="myonline-tv-web-v${VERSION}-linux-x64.tar.gz"
          SRC="myonline-tv-lxc-v${VERSION}-source.tar.gz"

          tar -C dist/publish -czf "${APP}" .
          tar \
            --exclude='.git' \
            --exclude='app/bin' \
            --exclude='app/obj' \
            --exclude='dist' \
            -czf "${SRC}" .

          sha256sum "${APP}" "${SRC}" > SHA256SUMS-RELEASE.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            myonline-tv-web-${{ github.ref_name }}-linux-x64.tar.gz
            myonline-tv-lxc-${{ github.ref_name }}-source.tar.gz
            SHA256SUMS-RELEASE.txt
            release.json
