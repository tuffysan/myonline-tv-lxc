name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches VERSION
        shell: bash
        run: |
          EXPECTED="v$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${EXPECTED})."
            exit 1
          fi

      - name: Validate scripts
        run: |
          bash -n install-lxc.sh
          bash -n update-from-github.sh
          bash -n health-check.sh
          bash -n rollback.sh
          bash -n uninstall-lxc.sh
          bash -n scripts/github-common.sh
          bash -n scripts/install-local.sh
          bash -n scripts/update-local.sh
          node --check app/wwwroot/app.js

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build app/MyOnlineTV.Web.csproj -c Release

      - name: Create source package
        run: |
          tar \
            --exclude='.git' \
            --exclude='app/bin' \
            --exclude='app/obj' \
            -czf "myonline-tv-lxc-${GITHUB_REF_NAME}.tar.gz" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: myonline-tv-lxc-${{ github.ref_name }}.tar.gz
