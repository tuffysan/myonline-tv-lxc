name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n install-lxc.sh
          bash -n update-from-github.sh
          bash -n health-check.sh
          bash -n rollback.sh
          bash -n uninstall-lxc.sh
          bash -n scripts/github-common.sh
          bash -n scripts/install-local.sh
          bash -n scripts/update-local.sh

      - name: JavaScript syntax
        run: |
          node --check app/wwwroot/app.js
          node --check app/wwwroot/mobile.js
          node --check app/wwwroot/continue-watching.js
          node --check app/wwwroot/sw.js

      - name: Mobile browser regression tests
        run: |
          npm install --prefix tests/mobile
          cd tests/mobile
          npx playwright install --with-deps chromium
          npm test

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build web app
        run: dotnet build app/MyOnlineTV.Web.csproj -c Release

      - name: Test download filename headers
        run: dotnet run --project tests/DownloadHeaders/DownloadHeaders.csproj -c Release

      - name: Test Continue Watching persistence
        run: python3 tests/continue_api.py

      - name: Publish web app
        run: dotnet publish app/MyOnlineTV.Web.csproj -c Release -o dist/publish


      - name: Validate release metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          version=Path("VERSION").read_text().strip()
          meta=json.loads(Path("release.json").read_text())
          assert meta["version"] == version
          assert meta["artifact"] == f"myonline-tv-web-v{version}-linux-x64.tar.gz"
          print("release.json OK")
          PY
      - name: Regression markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/api/media/start/{token}' app/Program.cs
          grep -Fq '/api/live/start/{providerId}/{channelKey}' app/Program.cs
          grep -Fq '/api/vod/{providerId}/{streamId}/token' app/Program.cs
          grep -Fq '/api/series/{providerId}/episode/{episodeId}/token' app/Program.cs
          grep -Fq 'playServerMedia(' app/wwwroot/app.js
          grep -Fq 'playLive(' app/wwwroot/app.js
          echo "Core regression markers present."
