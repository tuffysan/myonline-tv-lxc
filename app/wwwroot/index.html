<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyOnline TV</title>
<meta name="theme-color" content="#0b1622">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/app-icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="app" class="hidden">
  <aside>
    <div class="brand">
      <img class="brandIcon" src="/app-icon.svg" alt="">
      <h1>MyOnline TV</h1>
      <small id="brandVersion">Web</small>
    </div>
    <nav>
      <button data-view="home">⌂ Home</button>
      <button data-view="live">▣ Live TV</button>
      <button data-view="guide">▤ Guide</button>
      <button data-view="movies">▶ Movies</button>
      <button data-view="series">▦ Series</button>
      <button data-view="downloads">↓ Downloads</button>
      <button data-view="search">⌕ Search</button>
      <button data-view="system" data-admin-only>◉ System</button>
      <button data-view="admin" data-admin-only>🛡 Admin</button>
    </nav>
    <button id="logout" class="logout">Sign out</button>
  </aside>
  <main>
    <header>
      <div><b id="title">Home</b><span id="status"></span></div>
      <div id="userBadge"></div>
    </header>
    <section id="content"></section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
